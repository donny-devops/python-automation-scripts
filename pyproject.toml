[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-automation-scripts"
version = "1.1.0"
description = "Python automation tools for scraping, desktop assistance, and gamified task tracking."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Adonis Jimenez" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "requests>=2.32.3",
  "urllib3>=2.7.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3",
  "pandas>=2.2.2",
  "python-dotenv>=1.0.1",
  "tenacity>=9.0.0",
  "rich>=13.9.0",
]
scraper = [
  "requests>=2.32.3",
  "urllib3>=2.7.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3",
  "playwright>=1.44.0",
  "fake-useragent>=1.5.1",
  "tenacity>=9.0.0",
  "python-dotenv>=1.0.1",
  "rich>=13.9.0",
  "pandas>=2.2.2",
  "openpyxl>=3.1.5",
  "schedule>=1.2.0",
]
assistant = [
  "anthropic>=0.40.0",
  "pyttsx3>=2.90",
  "SpeechRecognition>=3.10.0",
  "plyer>=2.1.0",
  "schedule>=1.2.0",
  "python-dotenv>=1.0.1",
  "psutil>=5.9.8",
  "pyperclip>=1.8.2",
  "requests>=2.32.3",
]
dojo = [
  "rich>=13.9.0",
  "python-dotenv>=1.0.1",
  "anthropic>=0.40.0",
]
granola = [
  "rich>=13.9.0",
]

[project.scripts]
web-scraper = "python_automation_scripts.cli:web_scraper"
to-dojo = "python_automation_scripts.cli:to_dojo"
desktop-assistant = "python_automation_scripts.cli:desktop_assistant"
granola-engineer = "python_automation_scripts.cli:granola_engineer"

[tool.setuptools.packages.find]
include = ["python_automation_scripts*"]

[tool.pytest.ini_options]
pythonpath = ["web-scraper", "desktop-assistant", "to-dojo", "granola-engineer"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
